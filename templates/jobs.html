<!DOCTYPE html>
<html>
<head>
    <title>Available Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary">Available Opportunities</h2>
            <a href="/dashboard" class="btn btn-secondary fw-bold">Back</a>
        </div>
        {% for j in jobs %}
        <div class="card mb-3 border-0 shadow-sm" style="border-radius: 15px;">
            <div class="card-body p-4">
                <h4 class="card-title fw-bold">{{ j[2] }}</h4>
                <p class="card-text">{{ j[3] }}</p>
                <p class="text-muted">Location: {{ j[5] }} | Salary: Ksh {{ j[6] }}</p>
                {% if role == 'employee' %}
                <a href="/apply/{{ j[0] }}" class="btn btn-primary fw-bold">Apply Now</a>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
