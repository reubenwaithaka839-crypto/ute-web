<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Available Jobs</title>
</head>
<body class="bg-slate-950 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <a href="/dashboard" class="text-blue-400 font-bold hover:underline text-sm mb-8 inline-block">← Back to Dashboard</a>
        <h2 class="text-3xl font-black mb-8">Available Roles</h2>
        
        {% for j in jobs %}
        <div class="bg-slate-900 p-6 mb-6 rounded-2xl border border-white/10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h3 class="text-xl font-bold text-blue-400">{{ j['title'] }}</h3>
                <p class="text-slate-400 text-sm mt-1">{{ j['description'] }}</p>
                <p class="mt-2 text-yellow-500 font-black">KES {{ "{:,.2f}".format(j['salary']) }}</p>
            </div>
            {% if session.get('role') == 'employee' %}
            <a href="/apply/{{ j['id'] }}" class="bg-blue-600 px-8 py-3 rounded-xl font-bold hover:bg-blue-500 transition text-center w-full md:w-auto">Apply</a>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
