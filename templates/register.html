<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; color: white; }
        .supermax-input { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 1.5rem; padding: 1.5rem; color: white; width: 100%; font-size: 1.2rem; font-weight: 900; outline: none; transition: 0.3s; }
        .supermax-input:focus { border-color: #2563eb; background: rgba(255,255,255,0.08); }
        .btn-supermax { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; width: 100%; padding: 2rem; border-radius: 2rem; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; box-shadow: 0 20px 40px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-12 rounded-[3rem] w-full max-w-2xl">
        <h1 class="text-5xl font-black italic mb-10 text-center">CREATE ACCOUNT</h1>
        <form action="/register" method="POST" class="space-y-6">
            <input type="text" name="username" placeholder="USERNAME" class="supermax-input" required>
            <input type="email" name="email" placeholder="EMAIL ADDRESS" class="supermax-input" required>
            <input type="text" name="phone" placeholder="PHONE (e.g. 254...)" class="supermax-input" required>
            <input type="password" name="password" placeholder="SECURE PASSWORD" class="supermax-input" required>
            <select name="role" class="supermax-input">
                <option value="employee">EMPLOYEE</option>
                <option value="employer">EMPLOYER</option>
                <option value="admin">ADMINISTRATOR</option>
            </select>
            <button type="submit" class="btn-supermax mt-6">INITIALIZE ACCOUNT</button>
        </form>
    </div>
</body>
</html>
