{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[80vh]">
    <div class="card-cyber w-full max-w-lg border-t-4 border-[#00F3FF]">
        <h2 class="font-tech text-3xl text-center text-[#00F3FF] mb-8 tracking-widest">NEW IDENTITY</h2>
        
        <form method="POST">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-400 mb-2 font-mono text-xs">USERNAME</label>
                    <input type="text" name="username" required class="input-cyber">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 font-mono text-xs">EMAIL</label>
                    <input type="email" name="email" required class="input-cyber">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-gray-400 mb-2 font-mono text-xs">CONTACT NEXUS</label>
                <input type="text" name="contacts" required class="input-cyber">
            </div>

            <div class="mb-4">
                <label class="block text-gray-400 mb-2 font-mono text-xs">CLASS (ROLE)</label>
                <select name="role" id="role-select" class="input-cyber">
                    <option value="employee">EMPLOYEE</option>
                    <option value="employer">EMPLOYER</option>
                </select>
            </div>

            <div class="mb-4" id="biz-reg-group" style="display:none;">
                <label class="block text-gray-400 mb-2 font-mono text-xs">BUSINESS REG NO</label>
                <input type="text" name="business_reg_no" class="input-cyber">
            </div>

            <div class="mb-6">
                <label class="block text-gray-400 mb-2 font-mono text-xs">SET PASSCODE</label>
                <input type="password" name="password" required class="input-cyber">
            </div>
            
            <button type="submit" class="btn-cyber btn-blue">
                INITIALIZE PROFILE
            </button>
        </form>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    if(role) document.getElementById('role-select').value = role;

    document.getElementById('role-select').addEventListener('change', function() {
        const bizGroup = document.getElementById('biz-reg-group');
        bizGroup.style.display = this.value === 'employer' ? 'block' : 'none';
    });
</script>
{% endblock %}
