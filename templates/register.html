<form method="POST" class="space-y-4 bg-slate-900 p-10 rounded-[2rem] border border-white/10">
    <input type="text" name="username" placeholder="Full Name" required class="w-full p-4 bg-black rounded-xl text-white">
    <input type="email" name="email" placeholder="Email Address" required class="w-full p-4 bg-black rounded-xl text-white">
    <input type="text" name="contacts" placeholder="Phone Number / WhatsApp" required class="w-full p-4 bg-black rounded-xl text-white">
    <input type="password" name="password" placeholder="Passcode" required class="w-full p-4 bg-black rounded-xl text-white">
    <select name="role" class="w-full p-4 bg-black rounded-xl text-[#C5A021] font-bold">
        <option value="employee">Employee (Talent)</option>
        <option value="employer">Employer (Company)</option>
    </select>
    <button type="submit" class="w-full bg-[#C5A021] text-black py-4 rounded-xl font-bold">CREATE PRESTIGE ACCOUNT</button>
</form>
