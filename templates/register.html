<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .rw-logo { width: 80px; height: 80px; border: 4px solid #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; color: #3b82f6; margin: 0 auto 1.5rem; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .input-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; padding: 1rem; width: 100%; margin-bottom: 1rem; color: white; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white/5 backdrop-blur-xl p-8 rounded-[2rem] border border-white/10 w-full max-w-md text-center">
        <div class="rw-logo">RW</div>
        <h2 class="text-3xl font-black italic mb-6 tracking-tighter text-blue-500">UTE_WEB</h2>
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="USERNAME" class="input-box" required>
            <input type="email" name="email" placeholder="EMAIL" class="input-box" required>
            <input type="password" name="password" placeholder="PASSWORD" class="input-box" required>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" name="bank_name" placeholder="BANK" class="input-box" required>
                <input type="text" name="bank_account" placeholder="ACCOUNT" class="input-box" required>
            </div>
            <select name="role" class="input-box font-bold bg-slate-900">
                <option value="employee">EMPLOYEE</option>
                <option value="employer">EMPLOYER</option>
                <option value="admin">ADMIN (MASTERS ONLY)</option>
            </select>
            <button type="submit" class="w-full bg-blue-600 font-black py-4 rounded-xl mt-2 hover:bg-blue-500 transition shadow-lg shadow-blue-600/20">INITIALIZE ACCOUNT</button>
        </form>
    </div>
</body>
</html>
