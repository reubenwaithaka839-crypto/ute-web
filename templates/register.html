<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Join | RW PRESTIGE</title>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-6 text-white">
    <div class="max-w-md w-full bg-slate-900 p-10 rounded-3xl border border-yellow-500/20 shadow-2xl">
        <h2 class="text-3xl font-black mb-8 text-center uppercase tracking-tighter">Registration</h2>
        
        <form method="POST" class="space-y-5">
            <input type="text" name="username" placeholder="Username" required class="w-full bg-black border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-500">
            <input type="password" name="password" placeholder="Create Passcode" required class="w-full bg-black border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-500">
            <select name="role" class="w-full bg-black border border-white/10 p-4 rounded-xl outline-none">
                <option value="employee">Employee / Talent</option>
                <option value="employer">Employer / Business</option>
            </select>
            <div class="p-4 bg-yellow-500/10 border border-yellow-500/20 rounded-xl">
                <p class="text-xs text-yellow-500 font-bold uppercase text-center">Registration Fee: KES 100.00</p>
            </div>
            <button type="submit" class="w-full bg-yellow-500 text-black py-4 rounded-xl font-black uppercase tracking-widest hover:brightness-110">
                Register Account
            </button>
        </form>
        <p class="text-center mt-6 text-xs text-slate-500 uppercase font-bold">
            <a href="/login" class="hover:text-yellow-500">Back to Login</a>
        </p>
    </div>
</body>
</html>
