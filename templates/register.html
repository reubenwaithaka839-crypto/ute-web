<body class="bg-[#020617] flex items-center justify-center min-h-screen text-slate-300">
    <form action="/register" method="POST" class="w-full max-w-sm glass p-10 rounded-[2.5rem]">
        <h2 class="text-2xl font-black mb-6 text-white uppercase italic">Join UTE</h2>
        <input name="username" placeholder="Username" class="w-full bg-white/5 p-4 rounded-xl mb-4" required>
        <input name="email" placeholder="Email" class="w-full bg-white/5 p-4 rounded-xl mb-4" required>
        <input name="phone" placeholder="Phone (254...)" class="w-full bg-white/5 p-4 rounded-xl mb-4" required>
        <input name="password" type="password" placeholder="Password" class="w-full bg-white/5 p-4 rounded-xl mb-4" required>
        <select name="role" class="w-full bg-slate-800 p-4 rounded-xl mb-6">
            <option value="employee">Employee (Work & Get Paid)</option>
            <option value="employer">Employer (Hire & Pay)</option>
        </select>
        <button class="w-full bg-blue-600 p-4 rounded-xl font-black">CREATE ACCOUNT</button>
    </form>
</body>
