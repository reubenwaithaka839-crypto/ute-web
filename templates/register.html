{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 20px auto;">
    <h2 style="text-align: center;">NEW IDENTITY REGISTRATION</h2>
    <form method="POST">
        <div class="form-group">
            <label>USERNAME</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>EMAIL FREQUENCY</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>CONTACT NEXUS</label>
            <input type="text" name="contacts" required>
        </div>
        <div class="form-group">
            <label>CLASS (ROLE)</label>
            <select name="role">
                <option value="employee">EMPLOYEE</option>
                <option value="employer">EMPLOYER</option>
            </select>
        </div>
        <div class="form-group" id="biz-reg-group" style="display:none;">
            <label>BUSINESS REGISTRATION NO</label>
            <input type="text" name="business_reg_no">
        </div>
        <div class="form-group">
            <label>SET PASSCODE</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">INITIALIZE PROFILE</button>
    </form>
</div>

<script>
    document.querySelector('select[name="role"]').addEventListener('change', function() {
        const bizGroup = document.getElementById('biz-reg-group');
        if (this.value === 'employer') {
            bizGroup.style.display = 'block';
        } else {
            bizGroup.style.display = 'none';
        }
    });
</script>
{% endblock %}
