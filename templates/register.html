<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; color: white; }
        .supermax-input { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 1.2rem; padding: 1.2rem; color: white; width: 100%; font-weight: 900; margin-bottom: 1rem; outline: none; }
        .btn-supermax { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; padding: 1.5rem; border-radius: 1.5rem; font-weight: 900; text-transform: uppercase; width: 100%; border: none; cursor: pointer; box-shadow: 0 20px 40px rgba(37, 99, 235, 0.3); }
        .section-label { font-size: 10px; font-weight: 900; color: #3b82f6; letter-spacing: 0.2em; margin-bottom: 15px; display: block; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-20">
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-12 rounded-[3rem] w-full max-w-2xl">
        <h1 class="text-5xl font-black italic mb-10 text-center">JOIN UTE_WEB</h1>
        <form action="/register" method="POST">
            <span class="section-label">PERSONAL IDENTITY</span>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" name="username" placeholder="USERNAME" class="supermax-input" required>
                <input type="email" name="email" placeholder="EMAIL" class="supermax-input" required>
            </div>
            <input type="password" name="password" placeholder="PASSWORD" class="supermax-input" required>
            
            <span class="section-label mt-6">SETTLEMENT DETAILS (BANK LINK)</span>
            <input type="text" name="bank_name" placeholder="BANK NAME (e.g. Equity, KCB, Absa)" class="supermax-input" required>
            <input type="text" name="bank_account" placeholder="ACCOUNT NUMBER" class="supermax-input" required>
            <input type="text" name="phone" placeholder="MPESA / PHONE NUMBER" class="supermax-input" required>

            <span class="section-label mt-6">SYSTEM ROLE</span>
            <select name="role" class="supermax-input">
                <option value="employee">I AM AN EMPLOYEE</option>
                <option value="employer">I AM AN EMPLOYER</option>
                <option value="admin">SYSTEM ADMINISTRATOR</option>
            </select>

            <button type="submit" class="btn-supermax mt-8">INITIALIZE ACCOUNT</button>
        </form>
    </div>
</body>
</html>
