{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 20px auto; border-top: 3px solid var(--primary);">
    <h2 class="font-tech text-center text-2xl text-[#00F3FF] mb-6">NEW IDENTITY REGISTRATION</h2>
    <form method="POST">
        <div class="form-group">
            <label>USERNAME</label>
            <input type="text" name="username" required class="bg-black border border-gray-700 text-white">
        </div>
        <div class="form-group">
            <label>EMAIL FREQUENCY</label>
            <input type="email" name="email" required class="bg-black border border-gray-700 text-white">
        </div>
        <div class="form-group">
            <label>CONTACT NEXUS</label>
            <input type="text" name="contacts" required class="bg-black border border-gray-700 text-white">
        </div>
        <div class="form-group">
            <label>CLASS (ROLE)</label>
            <select name="role" id="role-select">
                <!-- JS will auto-select based on URL param -->
                <option value="employee">EMPLOYEE</option>
                <option value="employer">EMPLOYER</option>
            </select>
        </div>
        <div class="form-group" id="biz-reg-group" style="display:none;">
            <label>BUSINESS REGISTRATION NO</label>
            <input type="text" name="business_reg_no" class="bg-black border border-gray-700 text-white">
        </div>
        <div class="form-group">
            <label>SET PASSCODE</label>
            <input type="password" name="password" required class="bg-black border border-gray-700 text-white">
        </div>
        <button type="submit" class="btn w-full mt-4 font-tech">INITIALIZE PROFILE</button>
    </form>
</div>

<script>
    // Auto-select role if coming from portal selection
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    if(role) {
        document.getElementById('role-select').value = role;
    }

    document.getElementById('role-select').addEventListener('change', function() {
        const bizGroup = document.getElementById('biz-reg-group');
        if (this.value === 'employer') {
            bizGroup.style.display = 'block';
        } else {
            bizGroup.style.display = 'none';
        }
    });
</script>
{% endblock %}
