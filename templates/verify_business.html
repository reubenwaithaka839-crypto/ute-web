<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Business Verification</title>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">

<div class="bg-slate-900 p-10 rounded-2xl w-full max-w-md">

    <h2 class="text-2xl font-bold mb-6 text-center text-blue-500">
        Business Verification
    </h2>

    <form method="POST" class="space-y-4">

        <input name="business_name" placeholder="Registered Business Name"
               required class="w-full p-3 bg-black border rounded">

        <input name="registration_number" placeholder="Business Registration Number"
               required class="w-full p-3 bg-black border rounded">

        <button class="w-full bg-blue-600 p-3 rounded font-bold">
            Submit for Verification
        </button>
    </form>

</div>

</body>
</html>
