<!DOCTYPE html>
<html>
<head>
    <title>RW Prestige Admin Dashboard</title>
    <style>
        * { font-family: 'Courier New', monospace; margin: 0; padding: 0; }
        body { background: linear-gradient(45deg, #1a1a2e, #16213e); color: #00ff88; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 30px 0; }
        .stat-card { 
            background: rgba(0,255,136,0.1); 
            border: 2px solid #00ff88; 
            border-radius: 10px; 
            padding: 25px; 
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { background: rgba(0,255,136,0.2); transform: scale(1.05); }
        .stat-number { font-size: 3em; font-weight: bold; color: #00ff88; }
        .stat-label { font-size: 1.1em; opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; background: rgba(255,255,255,0.05); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(0,255,136,0.3); }
        th { background: rgba(0,255,136,0.2); }
        .btn { 
            background: #00ff88; color: #000; padding: 10px 20px; 
            border: none; border-radius: 5px; cursor: pointer; 
            text-decoration: none; display: inline-block; margin: 5px;
        }
        .btn:hover { background: #00cc6a; }
        .secure-badge { position: fixed; top: 10px; right: 10px; background: #ff0040; color: white; padding: 5px 10px; font-size: 0.8em; border-radius: 20px; }
    </style>
</head>
<body>
    <div class="secure-badge">🔒 RW_PRESTIGE_v3 SECURE</div>
    <div class="container">
        <h1>🚀 RW PRESTIGE ADMIN PANEL</h1>
        <p>Welcome, <strong>REUBEN</strong> | <a href="/logout" class="btn" style="background:#ff4444;color:white;">Logout</a></p>
        
        <!-- KEY STATS -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">{{ total_users }}</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">{{ live_jobs }}</div>
                <div class="stat-label">Live Jobs</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">{{ total_applications }}</div>
                <div class="stat-label">Applications</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">{{ total_employers }}</div>
                <div class="stat-label">Employers</div>
            </div>
        </div>
        
        <!-- QUICK ACTIONS
