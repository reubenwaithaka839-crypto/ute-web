<div class="kra-section" style="border-style: solid; border-color: #00ff88;">
    <h2 style="color: #00ff88;">Execute Prestige Payout</h2>
    <form action="/pay_salary" method="POST" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <input type="text" name="emp_username" placeholder="Employee Username" required>
        <input type="text" name="employer_username" placeholder="Employer Username" required>
        <input type="number" name="amount" placeholder="Gross Amount (KES)" required>
        <select name="is_first" class="btn-gold" style="background: #222; color: white;">
            <option value="true">First Month (30% Split)</option>
            <option value="false">Monthly (10% Split)</option>
        </select>
        <button type="submit" class="btn-gold" style="grid-column: span 2;">RELEASE FUNDS</button>
    </form>
</div>
