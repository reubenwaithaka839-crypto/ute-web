{% if session['username'] == 'REUBEN' %}

    <h2 class="text-red-500 font-black italic">ADMIN GOD CONTROL</h2>
    <form action="/admin/manage_admins" method="POST" class="mt-4 flex gap-4">
        <input type="text" name="target_user" placeholder="Target Username" class="bg-black p-2 rounded border border-white/10">
