<!DOCTYPE html>
<html lang="en">
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white min-h-screen p-10 font-sans">
    <h1 class="text-4xl font-black uppercase italic text-center mb-16 tracking-widest text-blue-500">Master Admin Chamber</h1>
    <div class="max-w-6xl mx-auto bg-slate-900 rounded-[3rem] border border-white/5 overflow-hidden shadow-2xl">
        <table class="w-full text-left">
            <thead class="bg-slate-800 text-slate-500 text-[10px] font-black uppercase">
                <tr><th class="p-8">Identity</th><th class="p-8">Protocol</th><th class="p-8 text-right">Action</th></tr>
            </thead>
            <tbody>
                {% for u in all_users %}
                <tr class="border-t border-white/5">
                    <td class="p-8 flex items-center gap-4 italic">{{ u.username }}</td>
                    <td class="p-8 uppercase text-blue-400 text-[10px] font-black">{{ u.role }}</td>
                    <td class="p-8 text-right">
                        {% if u.username.upper() != 'REUBEN' %}
                        <a href="/dismantle_admin/{{ u.username }}" class="w-10 h-10 bg-slate-800 rounded-lg flex items-center justify-center text-xs font-black hover:bg-red-600 transition-all">RW</a>
                        {% else %}<span class="text-yellow-500 font-black text-[9px] uppercase">Immortal</span>{% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
