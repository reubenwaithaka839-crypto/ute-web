{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>UPLOAD NEW MISSION</h2>
    <form method="POST">
        <div class="form-group"><label>TITLE</label><input type="text" name="title" required></div>
        <div class="form-group"><label>DESCRIPTION</label><textarea name="description" rows="4"></textarea></div>
        <div class="form-group"><label>SALARY OFFER</label><input type="number" name="salary" required></div>
        <div class="form-group"><label>LOCATION</label><input type="text" name="location"></div>
        <div class="form-group"><label>REQUIRED SKILLS</label><input type="text" name="skills_required"></div>
        <button type="submit" class="btn">BROADCAST</button>
    </form>
</div>
{% endblock %}
