<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2rem; padding: 2rem; }
        .btn-approve { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 1rem 2rem; border-radius: 1rem; font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-5xl font-black italic mb-12">SETTLEMENT_CONTROL</h1>
        
        <div class="space-y-6">
            {% for w in withdrawals %}
            <div class="glass-card flex flex-col md:flex-row justify-between items-center gap-8 border-l-8 border-emerald-500">
                <div>
                    <p class="text-[10px] font-black text-slate-500 uppercase">Beneficiary</p>
                    <p class="text-2xl font-black">{{ w.sender }}</p>
                    <p class="text-xs text-blue-400 font-bold uppercase">{{ w.bank_name }} | {{ w.bank_account }}</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] font-black text-slate-500 uppercase">Net Transfer</p>
                    <p class="text-3xl font-black text-emerald-400">KES {{ "{:,.2f}".format(w.net_amount) }}</p>
                    <p class="text-[10px] text-red-500 font-bold">UTE FEE: KES {{ w.deduction }}</p>
                </div>
                <form action="/approve_transfer/{{ w.id }}" method="POST">
                    <button class="btn-approve">COMPLETE TRANSFER</button>
                </form>
            </div>
            {% else %}
            <p class="text-slate-600 font-black italic">No pending settlements.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
