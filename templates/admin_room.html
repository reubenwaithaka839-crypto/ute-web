<h3 class="text-xl font-black text-white mb-6 uppercase italic">Pending Bank Payouts</h3>
<div class="glass rounded-3xl overflow-hidden mb-12">
    <table class="w-full text-left">
        <thead class="bg-white/5 text-[10px] uppercase text-slate-500">
            <tr><th class="p-4">User</th><th class="p-4">Amount</th><th class="p-4">Bank Details</th><th class="p-4">Action</th></tr>
        </thead>
        <tbody>
            {% for w in withdrawals %}
            <tr class="border-b border-white/5">
                <td class="p-4 font-bold">{{ w.sender }}</td>
                <td class="p-4 text-emerald-400 font-black">KES {{ w.amount }}</td>
                <td class="p-4 text-xs">Processing to Bank...</td>
                <td class="p-4"><button class="bg-blue-600 text-white px-4 py-1 rounded-lg text-[10px]">MARK AS SENT</button></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
