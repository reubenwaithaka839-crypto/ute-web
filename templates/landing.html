<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; }
        .btn-supermax {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 2rem 4rem;
            border-radius: 2.5rem;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: 0.3s;
            text-decoration: none;
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.4);
        }
        .btn-supermax:hover { transform: translateY(-5px); filter: brightness(1.2); }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 3rem; padding: 60px; text-align: center; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="glass-card">
        <h1 class="text-8xl font-black italic text-white mb-4">UTE_WEB</h1>
        <p class="text-blue-500 font-black tracking-widest mb-12">ELITE PAYROLL ARCHITECTURE</p>
        
        <a href="/register" class="btn-supermax">GET STARTED</a>
        
        <div class="mt-8">
            <a href="/login" class="text-slate-500 font-bold hover:text-white transition">ALREADY HAVE AN ACCOUNT? LOGIN</a>
        </div>
    </div>
</body>
</html>
