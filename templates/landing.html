<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTE_WEB | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background: #020617; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: screen;
            overflow: hidden;
        }

        /* THE SUPERMAX BUTTON */
        .btn-supermax {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 2.5rem 5rem;
            border-radius: 3rem;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
            text-align: center;
        }

        .btn-supermax:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 40px 80px -15px rgba(37, 99, 235, 0.7);
            filter: brightness(1.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4rem;
            padding: 80px;
            text-align: center;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        .glow-text {
            background: linear-gradient(to right, #fff 20%, #3b82f6 50%, #fff 80%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
    </style>
</head>
<body class="bg-slate-950 flex flex-col items-center justify-center h-screen">

    <div class="glass-card">
        <h1 class="text-7xl md:text-9xl font-black italic tracking-tighter text-white mb-4">UTE_WEB</h1>
        <p class="text-blue-500 font-black tracking-[0.5em] text-sm mb-16 opacity-80 uppercase">The Million Dollar Payroll System</p>
        
        <a href="/login" class="btn-supermax">
            ENTER CONSOLE
        </a>
        
        <p class="mt-12 text-slate-600 font-bold text-xs tracking-widest uppercase">Authorized Personnel Only</p>
    </div>

</body>
</html>
