<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6">
    <div class="max-w-2xl mx-auto bg-slate-900 p-10 rounded-[3rem] border border-white/5">
        <h1 class="text-3xl font-black mb-2 italic">APPLY: {{ job.title }}</h1>
        <p class="text-blue-500 font-bold mb-8 uppercase text-xs tracking-tighter">{{ job.location }} | KES {{ job.salary }}</p>
        
        <form action="/submit_application" method="POST" class="grid grid-cols-2 gap-4">
            <input type="hidden" name="job_id" value="{{ job.id }}">
            <input type="text" name="full_name" placeholder="Full Name" class="col-span-2 bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="text" name="id_number" placeholder="ID Number" class="bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="text" name="phone" placeholder="Phone" class="bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="email" name="email" placeholder="Email" class="bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="number" name="age" placeholder="Age" class="bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="text" name="location" placeholder="Current Location" class="bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="text" name="gender" placeholder="Gender" class="bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="text" name="photo_url" placeholder="Profile Photo URL" class="col-span-2 bg-slate-800 p-4 rounded-2xl outline-none">
            <textarea name="skills" placeholder="Why should we hire you? (Skills)" class="col-span-2 bg-slate-800 p-4 rounded-2xl outline-none h-32"></textarea>
            
            <button class="col-span-2 bg-green-600 py-5 rounded-3xl font-black uppercase tracking-widest mt-4">Submit Dossier</button>
        </form>
    </div>
</body>
</html>
