<!DOCTYPE html>
<html>
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#020617] text-white p-6">
    <form action="/submit_application" method="POST" class="max-w-xl mx-auto bg-white/5 p-10 rounded-3xl border border-white/10">
        <h2 class="text-2xl font-black mb-8 text-blue-500 uppercase italic">Employee Dossier</h2>
        <input type="hidden" name="job_id" value="{{ job.id }}">
        
        <div class="space-y-4">
            <input type="text" name="full_name" placeholder="Full Legal Name" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-sm" required>
            <input type="text" name="id_number" placeholder="National ID Number" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-sm" required>
            <input type="url" name="photo_url" placeholder="Profile Photo Link (Visible headshot)" class="w-full bg-blue-600/10 p-4 rounded-xl border border-blue-500/30 text-sm" required>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" name="phone" placeholder="Phone (M-Pesa)" class="bg-white/5 p-4 rounded-xl border border-white/10 text-sm" required>
                <input type="email" name="email" placeholder="Email Address" class="bg-white/5 p-4 rounded-xl border border-white/10 text-sm" required>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <select name="gender" class="bg-white/5 p-4 rounded-xl border border-white/10 text-sm"><option>Male</option><option>Female</option></select>
                <input type="number" name="age" placeholder="Age" class="bg-white/5 p-4 rounded-xl border border-white/10 text-sm" required>
            </div>
            <textarea name="skills" placeholder="List your professional skills..." class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-sm" rows="3"></textarea>
            <button class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-xs">Verify & Submit Application</button>
        </div>
    </form>
</body>
</html>
