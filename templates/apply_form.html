<!DOCTYPE html>
<html>
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white p-6">
    <form action="/submit_application" method="POST" class="max-w-2xl mx-auto bg-slate-900 p-12 rounded-[3.5rem] mt-10">
        <h2 class="text-2xl font-black mb-8 text-green-500">SUBMIT DOSSIER</h2>
        <input type="hidden" name="job_id" value="{{ job.id }}">
        <div class="grid grid-cols-2 gap-4 text-xs">
            <input type="text" name="full_name" placeholder="Legal Name" class="col-span-2 bg-slate-800 p-4 rounded-xl" required>
            <input type="text" name="id_number" placeholder="National ID Number" class="bg-slate-800 p-4 rounded-xl" required>
            <input type="text" name="photo_url" placeholder="Photo URL" class="bg-slate-800 p-4 rounded-xl" required>
            <input type="text" name="phone" placeholder="Contact Phone" class="bg-slate-800 p-4 rounded-xl">
            <input type="email" name="email" placeholder="Contact Email" class="bg-slate-800 p-4 rounded-xl">
            <input type="text" name="location" placeholder="City/Country" class="col-span-2 bg-slate-800 p-4 rounded-xl">
            <textarea name="skills" placeholder="Professional Skills" class="col-span-2 bg-slate-800 p-4 rounded-xl" rows="4"></textarea>
        </div>
        <button class="w-full bg-green-600 py-5 rounded-2xl font-black uppercase text-xs mt-6 shadow-xl">Send Information</button>
    </form>
</body>
</html>
