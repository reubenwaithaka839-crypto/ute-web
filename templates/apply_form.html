<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Dossier | Prestige</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-slate-900 p-12 rounded-[3.5rem] border border-white/5 shadow-2xl">
        <h1 class="text-3xl font-black italic text-green-500 mb-2">CANDIDATE DOSSIER</h1>
        <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mb-10">Role: {{ job.title }}</p>

        <form action="/submit_application" method="POST" class="space-y-5">
            <input type="hidden" name="job_id" value="{{ job.id }}">
            
            <input type="text" name="full_name" placeholder="Full Legal Name" class="w-full bg-slate-800 p-5 rounded-2xl font-bold text-sm outline-none border border-white/5 focus:border-green-500" required>
            
            <div class="flex gap-4">
                <input type="number" name="age" placeholder="Age" class="w-1/3 bg-slate-800 p-5 rounded-2xl font-bold text-sm outline-none border border-white/5" required>
                <select name="gender" class="w-2/3 bg-slate-800 p-5 rounded-2xl font-bold text-sm outline-none border border-white/5 text-slate-400">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <input type="text" name="phone" placeholder="M-Pesa Number" class="w-full bg-slate-800 p-5 rounded-2xl font-bold text-sm outline-none border border-white/5" required>
            <input type="email" name="email" placeholder="Email Address" class="w-full bg-slate-800 p-5 rounded-2xl font-bold text-sm outline-none border border-white/5" required>
            <input type="text" name="photo_url" placeholder="Profile Photo Link (URL)" class="w-full bg-slate-800 p-5 rounded-2xl font-bold text-sm outline-none border border-white/5">
            
            <textarea name="skills" placeholder="Professional Skills & Bio..." class="w-full bg-slate-800 p-5 rounded-2xl font-bold text-sm outline-none h-32 border border-white/5"></textarea>

            <button type="submit" class="w-full bg-green-600 py-5 rounded-[2rem] font-black uppercase text-sm shadow-xl shadow-green-500/20 hover:scale-[1.02] transition-transform">Submit to Network</button>
        </form>
    </div>
</body>
</html>
