{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>SYSTEM LEDGER</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>SENDER</th>
                <th>RECEIVER</th>
                <th>AMOUNT</th>
                <th>TYPE</th>
                <th>TIMESTAMP</th>
            </tr>
        </thead>
        <tbody>
            {% for tx in transactions %}
            <tr>
                <td>{{ tx.id }}</td>
                <td>{{ tx.sender }}</td>
                <td>{{ tx.receiver }}</td>
                <td style="color: var(--primary); font-weight: bold;">${{ tx.amount }}</td>
                <td>{{ tx.type }}</td>
                <td>{{ tx.timestamp }}</td>
            </tr>
            {% else %}
            <tr><td colspan="6">No records found in archive.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
