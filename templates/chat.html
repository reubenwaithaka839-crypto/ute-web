{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>SECURE CHANNEL: {{ room_id }}</h2>
    <div style="height: 300px; overflow-y: scroll; border: 1px solid var(--border); padding: 10px; margin-bottom: 10px;">
        {% for msg in chats %}
            <p><strong>[{{ msg.sender }}]:</strong> {{ msg.text }}</p>
        {% endfor %}
    </div>
    <form method="POST">
        <div style="display: flex; gap: 10px;">
            <input type="text" name="message" placeholder="Enter secure message..." required>
            <button type="submit" class="btn">SEND</button>
        </div>
    </form>
</div>
{% endblock %}
