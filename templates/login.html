{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[80vh]">
    <div class="card-cyber w-full max-w-md border-t-4 border-[#FFD700]">
        <h2 class="font-tech text-3xl text-center text-[#FFD700] mb-8 tracking-widest">SYSTEM LOGIN</h2>
        
        <form method="POST">
            <div class="mb-6">
                <label class="block text-gray-400 mb-2 font-mono text-sm">USERNAME</label>
                <input type="text" name="username" required autocomplete="off" class="input-cyber">
            </div>
            
            <div class="mb-8">
                <label class="block text-gray-400 mb-2 font-mono text-sm">PASSCODE</label>
                <input type="password" name="password" required class="input-cyber">
            </div>
            
            <button type="submit" class="btn-cyber btn-gold">
                AUTHENTICATE
            </button>
        </form>

        <p class="text-center mt-6 text-sm font-mono">
            <span class="text-gray-500">New to the matrix?</span> 
            <a href="{{ url_for('register') }}" class="text-[#00F3FF] hover:underline ml-2">INITIALIZE ID</a>
        </p>
    </div>
</div>
{% endblock %}
