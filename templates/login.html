<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | UTE Prestige</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 p-10 rounded-[2.5rem] border border-white/10 w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 rounded-full border-4 border-blue-500 flex items-center justify-center text-3xl font-black italic mx-auto mb-4">RW</div>
            <h1 class="text-2xl font-black italic">PRESTIGE ACCESS</h1>
            <p class="text-slate-500 text-xs uppercase tracking-widest font-bold">Secure Portal 2026</p>
        </div>
        
        <form action="/login" method="POST" class="space-y-4">
            <input type="text" name="username" placeholder="Username" class="w-full bg-slate-800 p-4 rounded-2xl outline-none focus:ring-2 ring-blue-500" required>
            <input type="password" name="passcode" placeholder="Secure Passcode" class="w-full bg-slate-800 p-4 rounded-2xl outline-none focus:ring-2 ring-blue-500" required>
            <input type="email" name="email" placeholder="Email Address" class="w-full bg-slate-800 p-4 rounded-2xl outline-none">
            <input type="text" name="phone" placeholder="Phone (M-Pesa)" class="w-full bg-slate-800 p-4 rounded-2xl outline-none">
            
            <select name="role" class="w-full bg-slate-800 p-4 rounded-2xl outline-none appearance-none font-bold text-blue-400">
                <option value="employee">EMPLOYEE ROLE</option>
                <option value="employer">EMPLOYER ROLE</option>
            </select>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black uppercase text-sm transition-all transform hover:scale-105 shadow-lg shadow-blue-500/20">
                Enter Dashboard
            </button>
        </form>
    </div>
</body>
</html>
