<body class="bg-[#020617] flex items-center justify-center min-h-screen text-slate-300">
    <form action="/login" method="POST" class="w-full max-w-sm glass p-10 rounded-[2.5rem]">
        <h2 class="text-2xl font-black mb-6 text-white uppercase italic">Login</h2>
        <input name="username" placeholder="Username" class="w-full bg-white/5 p-4 rounded-xl mb-4">
        <input name="password" type="password" placeholder="Password" class="w-full bg-white/5 p-4 rounded-xl mb-6">
        <button class="w-full bg-blue-600 p-4 rounded-xl font-black">ENTER CONSOLE</button>
    </form>
</body>
