<!DOCTYPE html>
<html lang="en">
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center">
    <form action="/login" method="POST" class="bg-slate-900 p-12 rounded-[3rem] w-full max-w-md border border-white/5">
        <div class="text-center mb-10"><div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-2xl font-black italic mx-auto mb-4">RW</div><h2 class="text-xl font-black">CHAMBER REGISTRATION</h2></div>
        <div class="space-y-4">
            <input type="text" name="username" placeholder="USERNAME" required class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 outline-none focus:border-blue-600 text-xs font-black uppercase">
            <input type="email" name="email" placeholder="EMAIL" required class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 outline-none focus:border-blue-600 text-xs font-black">
            <input type="password" name="passcode" placeholder="PASSCODE" required class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 outline-none focus:border-blue-600 text-xs font-black">
            <select name="role" class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black uppercase">
                <option value="employee">Employee Chamber</option>
                <option value="employer">Employer Chamber</option>
            </select>
            <button type="submit" class="w-full bg-blue-600 py-6 rounded-2xl font-black uppercase text-xs">Initialize Protocol</button>
        </div>
    </form>
</body>
</html>
