<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 3rem; }
        .supermax-input { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 1.5rem; padding: 1.5rem; color: white; width: 100%; font-size: 1.25rem; font-weight: 900; outline: none; transition: 0.3s; }
        .supermax-input:focus { border-color: #2563eb; background: rgba(255,255,255,0.08); }
        .btn-supermax { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; width: 100%; padding: 2rem; border-radius: 2rem; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; border: none; cursor: pointer; box-shadow: 0 20px 40px rgba(37, 99, 235, 0.4); transition: 0.3s; }
        .btn-supermax:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(37, 99, 235, 0.6); filter: brightness(1.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="glass-card p-12 w-full max-w-xl">
        <h1 class="text-5xl font-black text-white italic text-center mb-12 tracking-tighter">UTE_AUTH</h1>
        <form action="/login" method="POST" class="space-y-8">
            <div>
                <input type="text" name="username" placeholder="USERNAME" class="supermax-input">
            </div>
            <div>
                <input type="password" name="password" placeholder="PASSWORD" class="supermax-input">
            </div>
            <button class="btn-supermax">INITIALIZE LOGIN</button>
        </form>
    </div>
</body>
</html>
