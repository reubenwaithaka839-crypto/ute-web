{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto; border-top: 3px solid var(--primary);">
    <h2 style="text-align: center;">SYSTEM LOGIN</h2>
    <form method="POST">
        <div class="form-group">
            <label>USERNAME</label>
            <input type="text" name="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label>PASSCODE</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">AUTHENTICATE</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.8rem;">
        <a href="{{ url_for('register') }}" style="color: var(--secondary);">Create New ID</a>
    </p>
</div>
{% endblock %}
