<!DOCTYPE html>
<html>
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">
    <form action="/login" method="POST" class="max-w-md w-full bg-slate-900 p-10 rounded-[3rem] border border-white/10">
        <div class="flex justify-center mb-6">
            <div class="w-20 h-20 rounded-full border-4 border-blue-500 flex items-center justify-center text-3xl font-black italic shadow-2xl shadow-blue-500/20 text-white">RW</div>
        </div>
        <h2 class="text-center font-black mb-8 italic">INITIALIZE ACCESS</h2>
        <div class="space-y-4">
            <input type="text" name="username" placeholder="Name" class="w-full bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="password" name="passcode" placeholder="Passcode" class="w-full bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="email" name="email" placeholder="Email" class="w-full bg-slate-800 p-4 rounded-2xl outline-none" required>
            <input type="text" name="phone" placeholder="Phone" class="w-full bg-slate-800 p-4 rounded-2xl outline-none" required>
            <select name="role" class="w-full bg-slate-800 p-4 rounded-2xl outline-none font-bold text-xs uppercase">
                <option value="employee">Employee (Green Tier)</option>
                <option value="employer">Employer (Blue Tier)</option>
            </select>
            <button class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase text-xs tracking-widest mt-4">Enter Network</button>
        </div>
    </form>
</body>
</html>
