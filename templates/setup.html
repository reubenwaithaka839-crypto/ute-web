{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[80vh]">
    <div class="card-cyber w-full max-w-md border-t-4 border-red-600 shadow-[0_0_30px_rgba(220,38,38,0.4)]">
        <h2 class="font-tech text-3xl text-center text-red-500 mb-4 tracking-widest">INITIATE GOD MODE</h2>
        <p class="text-gray-400 text-sm text-center mb-8 font-mono">
            WARNING: This account will have full control over the system.<br>
            Choose your credentials wisely.
        </p>
        
        <form method="POST">
            <div class="mb-6">
                <label class="block text-gray-400 mb-2 font-mono text-xs">MASTER USERNAME</label>
                <input type="text" name="username" value="REUBEN" required class="input-cyber" style="border-color: red;">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-400 mb-2 font-mono text-xs">MASTER PASSCODE</label>
                <input type="password" name="password" placeholder="SET NEW PASSWORD" required class="input-cyber" style="border-color: red;">
            </div>
            
            <button type="submit" class="btn-cyber btn-red w-full">
                ESTABLISH SYSTEM
            </button>
        </form>
    </div>
</div>
{% endblock %}
