<!DOCTYPE html>
<html>
<head>
    <title>UTE Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold">UTE JOB CONNECT</span>
            <a href="/logout" class="btn btn-light btn-sm fw-bold">Logout</a>
        </div>
    </nav>

    <div class="container text-center">
        <h1 class="display-6">Hello, <span class="text-primary">{{ user }}</span>!</h1>
        <p class="badge bg-dark mb-5 text-uppercase px-3">{{ role }}</p>

        <div class="row g-4 justify-content-center">
            <div class="col-md-4">
                <div class="card p-4 h-100 border-0 shadow-sm" style="border-radius: 20px;">
                    <h3 class="text-primary">Job Board</h3>
                    <a href="/jobs" class="btn btn-primary btn-lg mt-auto fw-bold">View Jobs</a>
                </div>
            </div>

            {% if role == 'employer' %}
            <div class="col-md-4">
                <div class="card p-4 h-100 border-0 shadow-sm" style="border-radius: 20px;">
                    <h3 class="text-success">Post Job</h3>
                    <a href="/post_job" class="btn btn-success btn-lg mt-auto fw-bold">Create Listing</a>
                </div>
            </div>
            {% endif %}

            <div class="col-md-4">
                <div class="card p-4 h-100 border-0 shadow-sm" style="border-radius: 20px;">
                    <h3 class="text-warning">Wallet</h3>
                    <p class="fs-4 fw-bold">Ksh {{ balance }}</p>
                    <button class="btn btn-outline-warning btn-lg mt-auto fw-bold" data-bs-toggle="modal" data-bs-target="#depositModal">Deposit Money</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="depositModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Lipa na M-Pesa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form action="/deposit" method="POST">
                    <div class="modal-body text-start">
                        <div class="mb-3">
                            <label class="form-label">Phone Number (254...)</label>
                            <input type="text" name="phone" class="form-control" placeholder="254712345678" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount (Ksh)</label>
                            <input type="number" name="amount" class="form-control" placeholder="100" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Pay Now</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
