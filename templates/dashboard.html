<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Prestige Dashboard</title>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6 font-sans">

    <header class="flex justify-between items-center mb-12 bg-slate-900 p-8 rounded-[3rem] border border-white/5 shadow-2xl">
        <div class="flex items-center gap-6">
            <div class="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center text-3xl font-black italic">RW</div>
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter">PRESTIGE NETWORK</h1>
                <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Master Admin: Reuben</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            {% if user.username.upper() == 'REUBEN' %}
            <a href="/admin_panel" class="bg-blue-600 px-8 py-4 rounded-2xl font-black text-[10px] uppercase shadow-lg shadow-blue-500/30 hover:scale-105 transition-transform">
                Enter Admin Chamber
            </a>
            {% endif %}
            <div class="text-right">
                <p class="text-xs font-black text-blue-400">{{ user.username }}</p>
                <a href="/logout" class="text-[9px] text-red-500 font-black uppercase">Logout</a>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
        <div class="lg:col-span-12 text-center py-20 bg-slate-900 rounded-[3rem] border border-dashed border-white/10">
            <h2 class="text-xl font-black italic opacity-50 uppercase tracking-widest">Ready for Protocol Execution</h2>
        </div>
    </div>
</body>
</html>
