<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
        .header { background: #1e293b; color: white; padding: 1.5rem; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .container { max-width: 1200px; margin: 3rem auto; display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; }
        
        /* THE BIG ATTRACTIVE BUTTONS */
        .btn-card {
            width: 300px; height: 200px; border: none; border-radius: 24px;
            font-size: 1.25rem; font-weight: 800; cursor: pointer;
            transition: all 0.3s ease; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .btn-card:hover { transform: translateY(-10px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        
        .admin-theme { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .payment-theme { background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); }
        .employee-theme { background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%); }
        
        .status-pill { padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; background: #e2e8f0; margin-top: 10px; color: #475569; }
    </style>
</head>
<body>
    <div class="header"><h1>PREMIUM CONTROL SYSTEM</h1></div>

    <div class="container">
        {% if user.role == 'admin' %}
            <button class="btn-card admin-theme">
                ADMIN PANEL
                <span class="status-pill">Full Access</span>
            </button>
            <button class="btn-card admin-theme">
                SYSTEM LOGS
                <span class="status-pill">View Only</span>
            </button>
        {% endif %}

        <button onclick="payTen()" class="btn-card payment-theme">
            UPGRADE NOW
            <span class="status-pill">Pay 10 KES</span>
        </button>

        <button class="btn-card employee-theme">
            EMPLOYEE TOOLS
            <span class="status-pill">Standard Access</span>
        </button>
    </div>

    <script>
        function payTen() {
            alert("Sending request to your phone...");
            fetch('/pay', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                alert("Please check your phone for the M-Pesa PIN prompt!");
            })
            .catch(err => alert("Error: " + err));
        }
    </script>
</body>
</html>
