<!DOCTYPE html>
<html>
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#020617] text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-black italic border-b-2 border-blue-500">UTE_MASTER</h1>
            <a href="/logout" class="text-[10px] font-bold text-red-500 uppercase">Logout</a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="lg:col-span-1 space-y-6">
                <h3 class="text-xs font-black text-blue-500 uppercase">Management</h3>
                {% for mj in my_jobs %}
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <p class="font-bold text-sm">{{ mj.title }}</p>
                    <a href="/view_applicants/{{ mj.id }}" class="text-[10px] text-blue-400 font-black uppercase mt-2 block">View Applicants →</a>
                </div>
                {% endfor %}
            </div>

            <div class="lg:col-span-2 space-y-4">
                <h3 class="text-xs font-black text-slate-500 uppercase">Live Marketplace</h3>
                {% for job in jobs %}
                <div class="bg-white/5 p-6 rounded-3xl flex justify-between items-center border border-white/5 hover:border-blue-500/50 transition">
                    <div>
                        <h4 class="font-black text-lg">{{ job.title }}</h4>
                        <p class="text-xs text-slate-500">{{ job.location }} | KES {{ job.salary }}</p>
                    </div>
                    {% if job.id in applied_ids %}
                        <span class="bg-green-500/20 text-green-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase">✓ Applied</span>
                    {% else %}
                        <a href="/apply_form/{{ job.id }}" class="bg-blue-600 px-6 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-blue-500 transition">Apply Now</a>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
