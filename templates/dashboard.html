<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background: #f1f5f9; color: #0f172a; }
        .navbar { background: #1e293b; color: white; padding: 20px; text-align: center; font-size: 1.5rem; font-weight: bold; }
        .container { max-width: 1100px; margin: 50px auto; display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }

        /* THE MILLION DOLLAR BUTTONS */
        .big-button {
            width: 320px; height: 200px; border: none; border-radius: 25px;
            cursor: pointer; transition: all 0.3s ease; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 1.4rem; font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .big-button:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); opacity: 0.9; }
        
        .admin-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .pay-bg { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .emp-bg { background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); }
        
        .sub-text { font-size: 0.9rem; font-weight: 300; margin-top: 10px; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; }
    </style>
</head>
<body>

    <div class="navbar">PREMIUM CONTROL SYSTEM</div>

    <div class="container">
        {% if user.role == 'admin' %}
            <button class="big-button admin-bg" onclick="alert('Opening Admin Panel...')">
                ADMIN PANEL
                <span class="sub-text">Full Control Access</span>
            </button>
            <button class="big-button admin-bg" onclick="alert('Viewing System Logs...')">
                SYSTEM LOGS
                <span class="sub-text">Security Overview</span>
            </button>
        {% endif %}

        <button id="payBtn" class="big-button pay-bg" onclick="triggerPayment()">
            UPGRADE NOW
            <span class="sub-text">Pay 10 KES via M-Pesa</span>
        </button>

        <button class="big-button emp-bg" onclick="alert('Opening Staff Tools...')">
            EMPLOYEE TOOLS
            <span class="sub-text">Standard Workspace</span>
        </button>
    </div>

    <script>
        function triggerPayment() {
            const btn = document.getElementById('payBtn');
            btn.innerHTML = "PROCESSING...";
            btn.style.opacity = "0.5";

            fetch('/pay', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.id) {
                    alert("SUCCESS: Check your phone for the M-Pesa PIN prompt!");
                    btn.innerHTML = "PENDING PIN...";
                } else {
                    alert("ERROR: " + (data.error || "Could not start payment"));
                    btn.innerHTML = "UPGRADE NOW";
                    btn.style.opacity = "1";
                }
            })
            .catch(err => {
                console.error(err);
                alert("NETWORK ERROR: Connection failed.");
                btn.innerHTML = "UPGRADE NOW";
                btn.style.opacity = "1";
            });
        }
    </script>
</body>
</html>
