<!DOCTYPE html>
<html lang="en">
<head><script src="https://cdn.tailwindcss.com"></script><title>Dashboard | UTE</title></head>
<body class="bg-slate-950 text-white min-h-screen p-8 font-sans">
    <div class="max-w-7xl mx-auto flex justify-between items-center mb-10 bg-slate-900 p-6 rounded-[2.5rem] border border-white/5 shadow-2xl">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-xl font-black italic">RW</div>
            <h1 class="text-xl font-black italic uppercase tracking-tighter">Employee Chamber</h1>
        </div>
        <a href="/logout" class="bg-red-600/10 text-red-500 px-6 py-3 rounded-xl text-[10px] font-black uppercase">Log Out</a>
    </div>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10">
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-slate-900 p-10 rounded-[3rem] border border-white/5 text-center">
                <div class="w-20 h-20 bg-slate-800 rounded-3xl mx-auto mb-4 flex items-center justify-center text-3xl">👤</div>
                <h3 class="text-xl font-black uppercase">{{ user.username }}</h3>
                <div class="mt-6 pt-6 border-t border-white/5 space-y-2 text-[10px] font-black uppercase text-slate-500">
                    <p>Bank: {{ user.bank_name }}</p>
                    <p>Status: <span class="text-green-500">Verified</span></p>
                </div>
            </div>
        </div>
        <div class="lg:col-span-8 space-y-6">
            {% for job in jobs %}
            <div class="bg-slate-900 p-8 rounded-[3rem] border border-white/5 flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl hover:border-blue-600 transition-all">
                <div class="flex items-center gap-6">
                    <div class="w-14 h-14 bg-blue-600/10 rounded-2xl flex items-center justify-center text-xl">💼</div>
                    <div>
                        <h4 class="text-xl font-black italic uppercase tracking-tighter">{{ job.title }}</h4>
                        <p class="text-[10px] font-black text-slate-500 uppercase">{{ job.employer }}</p>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <p class="text-xl font-black italic">Ksh {{ job.salary }}</p>
                    <a href="/apply/{{ job.id }}" class="bg-white text-black px-10 py-5 rounded-2xl font-black uppercase text-[10px] hover:bg-blue-600 hover:text-white transition-all shadow-lg">Apply</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
