<!DOCTYPE html>
<html>
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#020617] text-white p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-black italic border-b-2 border-blue-500">UTE_MASTER</h1>
            <span class="text-[10px] text-slate-500 font-black">USER: {{ user.username }}</span>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="lg:col-span-1 space-y-6">
                <h3 class="text-xs font-black text-blue-500 uppercase">Master Management</h3>
                <div class="bg-white/5 p-6 rounded-3xl border border-white/10">
                    <form action="/post_job" method="POST" class="space-y-3">
                        <input type="text" name="title" placeholder="Job Title" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 text-xs">
                        <input type="number" name="salary" placeholder="KES Salary" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 text-xs">
                        <button class="w-full bg-blue-600 py-3 rounded-xl font-black text-[10px] uppercase">Post New Task</button>
                    </form>
                </div>
                {% for mj in my_jobs %}
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10 flex justify-between items-center">
                    <p class="font-bold text-xs">{{ mj.title }}</p>
                    <a href="/view_applicants/{{ mj.id }}" class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-lg text-[9px] font-black uppercase">Review</a>
                </div>
                {% endfor %}
            </div>

            <div class="lg:col-span-2 space-y-4">
                <h3 class="text-xs font-black text-slate-500 uppercase">Live Marketplace</h3>
                {% for job in jobs %}
                <div class="bg-white/5 p-6 rounded-3xl flex justify-between items-center border border-white/5">
                    <div>
                        <h4 class="font-black text-lg">{{ job.title }}</h4>
                        <p class="text-xs text-blue-400 font-bold">KES {{ job.salary }}</p>
                    </div>
                    {% if job.id in applied_ids %}
                        <span class="text-green-500 text-[10px] font-black uppercase">✓ Applied</span>
                    {% else %}
                        <a href="/apply_form/{{ job.id }}" class="bg-white text-black px-6 py-2 rounded-xl text-[10px] font-black uppercase">Apply</a>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
