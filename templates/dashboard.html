<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 3rem; padding: 3rem; }
        .btn-supermax { display: inline-block; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; padding: 1.5rem 3rem; border-radius: 2rem; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; text-decoration: none; transition: 0.3s; text-align: center; }
        .btn-supermax:hover { transform: translateY(-5px); filter: brightness(1.2); }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-16">
            <div>
                <h1 class="text-6xl font-black italic">DASHBOARD</h1>
                <p class="text-blue-500 font-black uppercase tracking-widest text-xs mt-2">Welcome, {{ user.username }}</p>
            </div>
            <div class="flex gap-4">
                {% if user.role == 'admin' %}
                <a href="/admin_room" class="btn-supermax bg-amber-600">ADMIN PANEL</a>
                {% endif %}
                <a href="/logout" class="text-slate-500 font-black uppercase text-xs self-center">Logout</a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="glass-card lg:col-span-1">
                <p class="text-slate-500 font-black uppercase text-xs mb-2">Available Balance</p>
                <h2 class="text-5xl font-black text-emerald-400 mb-10">KES {{ "{:,.2f}".format(balance) }}</h2>
                <form action="/withdraw" method="POST" class="space-y-4">
                    <input type="number" name="amount" placeholder="0.00" class="w-full bg-white/5 border border-white/10 p-6 rounded-2xl text-white font-black outline-none focus:border-blue-500" required>
                    <button type="submit" class="btn-supermax w-full">WITHDRAW TO BANK</button>
                </form>
            </div>

            <div class="lg:col-span-2">
                <h2 class="text-3xl font-black mb-8 italic">AVAILABLE OPPORTUNITIES</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {% for job in jobs %}
                    <div class="glass-card p-8 border-l-8 border-blue-600">
                        <p class="text-xs font-black text-blue-400 uppercase mb-2">{{ job.employer }}</p>
                        <h3 class="text-2xl font-black mb-4">{{ job.title }}</h3>
                        <p class="text-4xl font-black text-white mb-4">KES {{ "{:,.2f}".format(job.salary) }}</p>
                        <button class="btn-supermax w-full py-4 text-sm">APPLY NOW</button>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
