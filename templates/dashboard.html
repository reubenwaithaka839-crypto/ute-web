<section class="glass p-8 rounded-[2.5rem] mt-10">
    <h3 class="text-xl font-black mb-6 uppercase italic text-blue-400">Withdrawal Portal</h3>
    <form action="/withdraw" method="POST" class="flex gap-4">
        <input type="number" name="amount" placeholder="Amount to Bank" class="flex-1 bg-white/5 p-4 rounded-2xl border border-white/10">
        <button class="bg-emerald-600 text-white px-8 rounded-2xl font-black text-xs hover:bg-emerald-500">REQUEST PAYOUT</button>
    </form>
    <p class="text-[10px] text-slate-500 mt-4 uppercase">Funds will be sent to: <span class="text-white">{{ user.bank_name }} - {{ user.bank_account }}</span></p>
</section>
