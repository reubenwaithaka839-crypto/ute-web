<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Prestige Dashboard</title>
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = e => { if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false; };
    </script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6 font-sans">
    <header class="flex justify-between items-center mb-12 bg-slate-900 p-8 rounded-[3rem] border border-white/5 shadow-2xl">
        <div class="flex items-center gap-6">
            <div class="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center text-3xl font-black italic">RW</div>
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter uppercase">Prestige Network</h1>
                <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Master: Reuben</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            {% if user.username.upper() == 'REUBEN' %}
            <a href="/admin_panel" class="bg-blue-600 px-8 py-4 rounded-2xl font-black text-[10px] uppercase shadow-lg shadow-blue-500/30">Enter Chamber</a>
            {% endif %}
            <a href="/logout" class="text-[10px] text-red-500 font-black uppercase">Logout</a>
        </div>
    </header>

    <div class="max-w-6xl mx-auto flex flex-col items-center justify-center py-32 bg-slate-900 rounded-[4rem] border border-white/5 shadow-inner">
        <div class="w-48 h-48 rounded-[3rem] bg-blue-600 flex items-center justify-center text-8xl font-black italic shadow-[0_0_120px_rgba(37,99,235,0.4)] mb-10 border-4 border-white/10">RW</div>
        <h2 class="text-5xl font-black italic tracking-tighter mb-4 text-center">WELCOME TO UTE_WEB</h2>
        <p class="text-blue-500 font-black uppercase tracking-[0.6em] text-[10px]">Secure Financial Interface Active</p>
    </div>
</body>
</html>
