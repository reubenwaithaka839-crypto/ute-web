<!DOCTYPE html>
<html>
<head>
    <title>UTE Command Center</title>
    <script src="https://unpkg.com/intasend-inlinejs-sdk@3.0.4/build/intasend-inline.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .btn { background: #3b82f6; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; border:none; cursor:pointer; font-weight:bold; }
        .balance { font-size: 2em; color: #22c55e; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>UTE.AI | {{ user }}</h2>
        <a href="/logout" style="color: #ef4444; text-decoration: none;">Sign Out</a>
    </div>

    <div class="card">
        <p>WALLET BALANCE (GLOBAL ESCROW)</p>
        <div class="balance">KES {{ "{:,.2f}".format(balance) }}</div>
        <hr style="border-color: #334155; margin: 15px 0;">
        
        {% if role == 'employer' %}
        <button class="intaSendPayButton btn" 
                data-amount="1000" 
                data-currency="KES" 
                data-email="{{ session['email'] }}" 
                data-first_name="{{ user }}">
            Deposit Funds (M-Pesa/Card)
        </button>
        {% endif %}
    </div>

    <script>
        new window.IntaSend({
            publicAPIKey: "{{ is_key }}",
            live: false // Set to true when you go live
        })
        .on("COMPLETE", (results) => {
            alert("Payment Successful! Wallet updating...");
            location.reload();
        })
        .on("FAILED", (results) => {
            alert("Payment Failed. Please try again.");
        })
        .on("IN-PROGRESS", (results) => {
            console.log("Payment in progress...");
        });
    </script>
</body>
</html>
