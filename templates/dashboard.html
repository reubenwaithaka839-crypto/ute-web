<div class="glass rounded-3xl overflow-hidden mt-10">
    <div class="p-6 border-b border-white/10 flex justify-between items-center bg-blue-600/10">
        <h3 class="font-bold text-xl">My Active Contracts</h3>
        <i class="fa fa-file-contract text-blue-400"></i>
    </div>
    <table class="w-full text-left">
        <thead class="bg-white/5 text-slate-400 text-sm">
            <tr>
                <th class="p-4">Partner</th>
                <th class="p-4">Salary</th>
                <th class="p-4">Months Paid</th>
                <th class="p-4 text-center">Action</th>
            </tr>
        </thead>
        <tbody>
            {% for c in contracts %}
            <tr class="border-b border-white/5">
                <td class="p-4 font-bold text-white">
                    {{ c.employee if user.role != 'employee' else c.employer }}
                </td>
                <td class="p-4">KES {{ "{:,.2f}".format(c.salary) }}</td>
                <td class="p-4 text-center">
                    <span class="bg-slate-700 px-3 py-1 rounded-lg">{{ c.total_months_paid }}</span>
                </td>
                <td class="p-4 text-center">
                    {% if user.role != 'employee' %}
                    <button onclick="payStaff({{ c.id }})" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-xl font-black shadow-lg shadow-green-500/20 transition-all">
                        PAY SALARY
                    </button>
                    {% else %}
                    <span class="text-green-400 text-xs font-bold uppercase">Active Employment</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
function payStaff(contractId) {
    if(confirm("Initiate M-Pesa payment for this contract?")) {
        fetch(`/pay_contract/${contractId}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if(data.error) alert("Error: " + data.error);
            else {
                alert("M-Pesa Push Sent! Once you enter your PIN, the wallet will update.");
                location.reload();
            }
        });
    }
}
</script>
