<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #0f172a; color: white; text-align: center; }
        .header { background: #1e293b; padding: 30px; border-bottom: 3px solid #38bdf8; margin-bottom: 40px; }
        .container { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; padding: 20px; }
        
        .btn-large {
            width: 320px; height: 200px; border: none; border-radius: 25px;
            font-size: 1.4rem; font-weight: 800; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s; color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-large:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        
        .admin-btn { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .pay-btn { background: linear-gradient(135deg, #0ea5e9 0%, #22c55e 100%); }
        .emp-btn { background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%); }
        
        .small-text { font-size: 0.8rem; font-weight: normal; margin-top: 10px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="header"><h1>PREMIUM CONTROL SYSTEM</h1></div>

    <div class="container">
        {% if user.role == 'admin' %}
            <button class="btn-large admin-btn">ADMIN PANEL<span class="small-text">Master Controls</span></button>
            <button class="btn-large admin-btn">SYSTEM LOGS<span class="small-text">Security Feed</span></button>
        {% endif %}

        <button id="payBtn" onclick="runPayment()" class="btn-large pay-btn">
            UPGRADE NOW
            <span class="small-text">Pay 10 KES to 254750289733</span>
        </button>

        <button class="btn-large emp-btn">EMPLOYEE TOOLS<span class="small-text">Standard Access</span></button>
    </div>

    <script>
        function runPayment() {
            const btn = document.getElementById('payBtn');
            btn.innerHTML = "SENDING PROMPT...";
            btn.style.opacity = "0.5";

            fetch('/pay', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if(data.id) {
                    alert("STK PUSH SENT! Please check your phone for the M-Pesa PIN prompt.");
                } else {
                    alert("Error: " + (data.error || "Authentication failed. Check your keys."));
                }
                btn.innerHTML = "UPGRADE NOW<span class='small-text'>Pay 10 KES</span>";
                btn.style.opacity = "1";
            })
            .catch(err => alert("Connection Error. Is the server Live?"));
        }
    </script>
</body>
</html>
