<!DOCTYPE html><html><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary mb-4"><div class="container"><span class="navbar-brand">UTE</span><a href="/logout" class="btn btn-light btn-sm">Logout</a></div></nav>
<div class="container text-center"><h1>Welcome, {{ user }}</h1><p class="badge bg-dark">{{ role }}</p>
<div class="row g-4 justify-content-center"><div class="col-md-4"><div class="card p-4 shadow-sm"><h3>Jobs</h3><a href="/jobs" class="btn btn-primary">View</a></div></div>
{% if role == 'employer' %}<div class="col-md-4"><div class="card p-4 shadow-sm"><h3>Post</h3><a href="/post_job" class="btn btn-success">Create</a></div></div>{% endif %}
<div class="col-md-4"><div class="card p-4 shadow-sm"><h3>Wallet</h3><p>Ksh {{ balance }}</p><button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#m">Deposit</button></div></div></div></div>
<div class="modal fade" id="m"><div class="modal-dialog"><div class="modal-content p-4"><form action="/deposit" method="POST"><input name="phone" class="form-control mb-2" placeholder="2547..."><input name="amount" class="form-control mb-2" placeholder="Amount"><button class="btn btn-success w-100">Pay Now</button></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
