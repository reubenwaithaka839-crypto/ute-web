<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Apply | UTE_WEB</title>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-2xl bg-slate-900 p-12 rounded-[3.5rem] border border-white/5 shadow-2xl">
        <h2 class="text-3xl font-black italic text-blue-500 mb-2 uppercase tracking-tighter">Apply: {{ job.title }}</h2>
        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-10 italic">Prestige Talent Submission</p>

        <form action="/apply/{{ job.id }}" method="POST" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" name="phone" placeholder="PHONE CONTACT" required class="bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
                <input type="email" name="email" placeholder="CONFIRM EMAIL" required class="bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
                <input type="number" name="age" placeholder="AGE" required class="bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
                <select name="gender" class="bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black uppercase">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <input type="text" name="skills" placeholder="PRIMARY SKILLS (e.g. Sales, Design, Coding)" required class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black uppercase">
            <input type="text" name="photo" placeholder="PROFILE PHOTO URL (Image Link)" required class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">

            <div class="bg-blue-600/10 p-8 rounded-3xl border border-blue-500/30">
                <p class="text-xs font-bold leading-relaxed text-slate-300 italic">
                    By clicking Apply, you agree to the <span class="text-blue-400">UTE Partnership Success Fee</span>. To keep the network premium, a friendly 30% is deducted from your first successful salary, followed by a continuous 10% support fee for the duration of one year.
                </p>
            </div>

            <div class="flex gap-4">
                <a href="/dashboard" class="w-1/3 bg-slate-800 py-6 rounded-2xl text-center font-black uppercase text-[10px] tracking-widest hover:bg-red-600 transition-all">Reject</a>
                <button type="submit" class="w-2/3 bg-blue-600 py-6 rounded-2xl font-black uppercase tracking-widest text-[10px] shadow-lg shadow-blue-500/20 hover:scale-105 transition-all">Apply Now</button>
            </div>
        </form>
    </div>
</body>
</html>
