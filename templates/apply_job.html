<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Apply | UTE</title>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-2xl bg-slate-900 p-12 rounded-[3.5rem] border border-white/5 shadow-2xl">
        <h2 class="text-3xl font-black italic text-blue-500 uppercase mb-8">Apply: {{ job['title'] }}</h2>
        <form action="/apply/{{ job['id'] }}" method="POST" class="space-y-6">
            <input type="text" name="full_name" placeholder="FULL LEGAL NAME" required class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
            <input type="email" name="email" placeholder="EMAIL ADDRESS" required class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" name="phone" placeholder="PHONE" required class="bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
                <input type="number" name="age" placeholder="AGE" required class="bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
            </div>
            <input type="text" name="skills" placeholder="PRIMARY SKILLS (Comma separated)" required class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
            <input type="text" name="photo_url" placeholder="PHOTO URL (Optional)" class="w-full bg-slate-950 p-5 rounded-2xl border border-white/5 text-xs font-black">
            
            <div class="bg-blue-600/10 p-8 rounded-3xl border border-blue-500/30">
                <p class="text-[11px] font-bold italic text-slate-300">By clicking apply, you enter the UTE Partnership Protocol.</p>
            </div>
            <div class="flex gap-4">
                <a href="/dashboard" class="w-1/3 bg-slate-800 py-6 rounded-2xl text-center font-black uppercase text-[10px] hover:bg-red-600 transition-all">Reject</a>
                <button type="submit" class="w-2/3 bg-blue-600 py-6 rounded-2xl font-black uppercase text-[10px] shadow-lg hover:bg-blue-500 transition-all">Apply Now</button>
            </div>
        </form>
    </div>
</body>
</html>
