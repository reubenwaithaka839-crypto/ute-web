{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>APPLY FOR MISSION: {{ job.title }}</h2>
    <form method="POST">
        <div class="form-group"><label>FULL NAME</label><input type="text" name="full_name" required></div>
        <div class="form-group"><label>AGE</label><input type="number" name="age" required></div>
        <div class="form-group"><label>PHONE</label><input type="text" name="phone" required></div>
        <div class="form-group"><label>SKILLS SET</label><textarea name="skills" required></textarea></div>
        <button type="submit" class="btn">SUBMIT APPLICATION</button>
    </form>
</div>
{% endblock %}
