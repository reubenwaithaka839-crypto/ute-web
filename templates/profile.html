<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | UTE_WEB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 min-h-screen">
    <div class="max-w-4xl mx-auto p-6 lg:p-12">
        <header class="flex justify-between items-center mb-12">
            <a href="/" class="text-blue-400 font-bold hover:underline"><i class="fa fa-arrow-left"></i> Back to Console</a>
            <h1 class="text-2xl font-black text-white">ACCOUNT SETTINGS</h1>
        </header>

        <div class="glass rounded-[2.5rem] p-8 lg:p-12">
            <div class="flex items-center space-x-6 mb-12">
                <div class="w-24 h-24 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl flex items-center justify-center text-4xl font-black text-white">
                    {{ user.username[0].upper() }}
                </div>
                <div>
                    <h2 class="text-3xl font-bold text-white">{{ user.username }}</h2>
                    <p class="text-slate-500 uppercase tracking-widest text-xs font-bold">{{ user.role }}</p>
                </div>
            </div>

            <form action="/profile" method="POST" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Location</label>
                        <input type="text" name="location" value="{{ user.location or '' }}" placeholder="Nairobi, Kenya"
                            class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Email Address</label>
                        <input type="text" value="{{ user.email }}" disabled
                            class="w-full bg-white/5 border border-white/5 p-4 rounded-2xl text-slate-600 cursor-not-allowed">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Bio / Company Description</label>
                    <textarea name="bio_or_company" rows="4" placeholder="Tell us about your work or company..."
                        class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:border-blue-500 outline-none transition">{{ user.bio_or_company or '' }}</textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-5 rounded-2xl font-black text-xl shadow-xl shadow-blue-500/20 transition-all">
                    SAVE CHANGES
                </button>
            </form>
        </div>
    </div>
</body>
</html>
