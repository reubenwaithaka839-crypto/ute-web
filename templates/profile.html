<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RW Prestige - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050a14;
            --panel-bg: #0f172a;
            --accent-cyan: #06b6d4;
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Segoe UI', sans-serif;
            padding-top: 80px;
            padding-bottom: 50px;
        }

        /* --- NAVBAR STYLES (SAME AS DASHBOARD) --- */
        .navbar {
            background: rgba(5, 10, 20, 0.95) !important;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            padding: 15px 0;
        }

        .navbar-brand {
            color: var(--accent-cyan) !important;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        .nav-link {
            color: #94a3b8 !important;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-right: 15px;
            font-weight: 600;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-cyan) !important;
            text-shadow: 0 0 8px var(--accent-cyan);
            transform: translateY(-2px);
        }

        /* --- LOGOUT BUTTON (RED GLOW) --- */
        .btn-logout {
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 8px 20px;
            border-radius: 4px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: #fff !important;
            box-shadow: 0 0 20px #ef4444;
            transform: scale(1.05);
        }

        /* --- PROFILE CARD STYLES --- */
        .profile-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        
        .avatar-circle {
            width: 120px;
            height: 120px;
            background: var(--accent-cyan);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #000;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
        }

        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
        }

        .form-control:focus {
            background: #1e293b;
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .form-label {
            color: var(--accent-cyan);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn-save {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 12px 40px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-save:hover {
            box-shadow: 0 0 30px var(--accent-cyan);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="fas fa-network-wired me-2"></i>RW PRESTIGE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Matrix</a></li>
                    <li class="nav-item"><a class="nav-link" href="/jobs">All Jobs</a></li>
                    <li class="nav-item active"><a class="nav-link" href="/profile">Profile</a></li>
                    <!-- LOGOUT BUTTON -->
                    <li class="nav-item ms-2">
                        <a class="nav-link btn-logout" href="/logout"><i class="fas fa-power-off me-1"></i> Terminate</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">
        
        <!-- Alerts -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-success mb-4" style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green);">
                    <i class="fas fa-check-circle me-2"></i> {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Profile Header -->
        <div class="profile-header">
            <div class="avatar-circle">
                <i class="fas fa-user-astronaut"></i>
            </div>
            <h2 class="text-white mb-0">{{ user.username }}</h2>
            <span class="badge bg-secondary mt-2 text-uppercase">{{ user.role }}</span>
        </div>

        <!-- Edit Form -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card" style="background: #0f172a; border: 1px solid #334155; border-radius: 10px;">
                    <div class="card-body p-4">
                        <h4 class="mb-4" style="color: var(--accent-cyan); border-bottom: 1px solid #334155; padding-bottom: 10px;">
                            <i class="fas fa-cogs me-2"></i> Update Entity Data
                        </h4>
                        
                        <form method="POST">
                            <div class="mb-4">
                                <label class="form-label">Current Location</label>
                                <input type="text" name="location" class="form-control" value="{{ user.location or '' }}">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Bio / Company Description</label>
                                <textarea name="bio_or_company" class="form-control" rows="4">{{ user.bio_or_company or '' }}</textarea>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-save">Save Changes</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
