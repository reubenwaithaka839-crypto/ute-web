<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RW Prestige - Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050a14;
            --panel-bg: #0f172a;
            --accent-cyan: #06b6d4;
            --text-glow: 0 0 10px rgba(6, 182, 212, 0.7);
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #111827 0%, #000000 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* THE GLOWING BUTTON CLASS */
        .btn-cyber {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            padding: 15px 40px;
            border-radius: 5px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }

        .btn-cyber:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 40px var(--accent-cyan), inset 0 0 20px var(--accent-cyan);
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-cyber-outline {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 40px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .btn-cyber-outline:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 1rem;
        }

        .hero-subtitle {
            color: var(--accent-cyan);
            letter-spacing: 2px;
            margin-bottom: 3rem;
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .floating-card {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container text-center floating-card">
        <h1 class="hero-title">RW Prestige</h1>
        <h3 class="hero-subtitle">Ultimate Job & Talent Ecosystem</h3>
        
        <div class="d-flex gap-4 justify-content-center mt-5">
            <!-- Create Account Button -->
            <a href="/terms" class="btn btn-cyber">
                <i class="fas fa-user-plus me-2"></i> Initialize Account
            </a>
            
            <!-- Login Button -->
            <a href="/login" class="btn btn-cyber-outline">
                <i class="fas fa-sign-in-alt me-2"></i> Access Portal
            </a>
        </div>
    </div>

</body>
</html>
