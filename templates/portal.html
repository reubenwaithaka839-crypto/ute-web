<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RW Prestige - Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050a14;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --grid-color: rgba(6, 182, 212, 0.15);
        }

        body {
            background-color: var(--bg-dark);
            /* HIGH TECH GRID BACKGROUND */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        /* --- THE RW CIRCLE LOGO (PURE CSS) --- */
        .logo-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .rw-circle {
            width: 150px;
            height: 150px;
            border: 4px solid var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: 900;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.05);
            box-shadow: 0 0 30px var(--accent-cyan), inset 0 0 20px var(--accent-cyan);
            animation: pulse-glow 3s infinite ease-in-out;
            position: relative;
            z-index: 2;
        }

        .rw-circle::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 2px dashed rgba(6, 182, 212, 0.5);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px var(--accent-cyan); }
            50% { box-shadow: 0 0 50px var(--accent-cyan), inset 0 0 30px var(--accent-cyan); }
            100% { box-shadow: 0 0 20px var(--accent-cyan); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* --- BUTTON STYLES --- */
        .btn-cyber-main {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            padding: 18px 45px;
            border-radius: 5px;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
            display: inline-block;
            min-width: 220px;
        }

        .btn-cyber-main:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 50px var(--accent-cyan);
            transform: translateY(-5px);
            text-shadow: none;
        }

        .btn-cyber-sec {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 18px 45px;
            border-radius: 5px;
            transition: all 0.3s ease;
            min-width: 220px;
        }

        .btn-cyber-sec:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .hero-sub {
            color: #94a3b8;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <!-- THE RW CIRCLE LOGO -->
        <div class="logo-container">
            <div class="rw-circle">RW</div>
        </div>

        <h1 class="hero-title">Prestige</h1>
        <p class="hero-sub">Ultimate Job & Talent Ecosystem</p>
        
        <div class="d-flex flex-column flex-md-row gap-4 justify-content-center">
            <!-- Initialize Account Button -->
            <a href="/terms" class="btn btn-cyber-main">
                <i class="fas fa-user-plus me-2"></i> Initialize
            </a>
            
            <!-- Login Button -->
            <a href="/login" class="btn btn-cyber-sec">
                <i class="fas fa-sign-in-alt me-2"></i> Access
            </a>
        </div>
    </div>

</body>
</html>
