<!DOCTYPE html>
<html>
<head>
    <title>UTE - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 card p-4 shadow-sm border-0" style="border-radius: 15px;">
                <h2 class="text-center mb-4 text-primary fw-bold">UTE LOGIN</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input name="password" type="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">I want to:</label>
                        <select name="role" class="form-select">
                            <option value="employee">Find Work (Employee)</option>
                            <option value="employer">Post Jobs (Employer)</option>
                        </select>
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-bold">Continue</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
