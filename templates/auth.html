<!DOCTYPE html>
<html>
<head>
    <title>UTE | Identity Vault</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; width: 350px; border: 1px solid #334155; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Identity Vault</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="text" name="phone" placeholder="Phone (254...)" required>
            <input type="text" name="national_id" placeholder="National ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="text" name="location" placeholder="Location (City)" required>
            
            <select name="role" id="roleSelect" onchange="updateLabel()">
                <option value="employee">I am looking for Work (Employee)</option>
                <option value="employer">I am Hiring (Organization)</option>
            </select>

            <label id="dynLabel" style="font-size: 0.8em; color: #94a3b8;">Professional Skills</label>
            <input type="text" name="bio_or_company" id="dynInput" placeholder="e.g. Accounting, Java..." required>
            
            <button type="submit">Secure Identity & Enter</button>
        </form>
    </div>

    <script>
        function updateLabel() {
            var role = document.getElementById("roleSelect").value;
            document.getElementById("dynLabel").innerText = role === "employer" ? "Company Name" : "Professional Skills";
            document.getElementById("dynInput").placeholder = role === "employer" ? "e.g. UTE Global Ltd" : "e.g. Accounting, Java...";
        }
    </script>
</body>
</html>
