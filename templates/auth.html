<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Secure Portal</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 3rem; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
        .btn { background: #38bdf8; color: #0f172a; padding: 12px 40px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; transition: 0.3s; }
        .btn:hover { background: #7dd3fc; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to the App</h1>
        <p style="color: #94a3b8; margin-bottom: 2rem;">Experience the premium dashboard</p>
        <a href="/dashboard" class="btn">ENTER DASHBOARD</a>
    </div>
</body>
</html>
